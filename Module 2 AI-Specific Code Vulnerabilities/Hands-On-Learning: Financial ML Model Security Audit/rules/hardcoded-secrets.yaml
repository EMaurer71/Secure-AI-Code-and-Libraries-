rules:
  - id: hardcoded-api-key
    message: "Hardcoded API key detected — secrets must not be stored in source code."
    severity: ERROR
    languages: [python]
    pattern: |
      $VAR = "$SECRET"
    metavariable-pattern:
      metavariable: $SECRET
      pattern: /[A-Za-z0-9]{20,}/

  - id: hardcoded-secret-token
    message: "Hardcoded secret token detected — move secrets to environment variables."
    severity: ERROR
    languages: [python]
    pattern: |
      $VAR = "token_$REST"

  - id: hardcoded-jwt-token
    message: "Hardcoded JWT token detected — never embed JWTs directly in code."
    severity: WARNING
    languages: [python]
    pattern: |
      $VAR = "Bearer $REST"

