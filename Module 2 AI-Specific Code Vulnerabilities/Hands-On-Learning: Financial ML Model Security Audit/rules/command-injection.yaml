rules:
  - id: command-injection-os-system
    message: "Potential command injection via os.system — avoid executing shell commands with untrusted input."
    severity: ERROR
    languages: [python]
    pattern: os.system($CMD)

  - id: command-injection-subprocess
    message: "Potential command injection via subprocess — avoid shell=True or unvalidated command strings."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: subprocess.run($CMD, ...)
      - pattern-not: subprocess.run([$CMD], ...)

